# The gate: every push to main and every PR runs the full desktop build.
#
# This file is deliberately only a caller. The build itself lives in
# desktop-build.yml, which release.yml calls too. It used to be a third copy
# of the same steps, and the copies had already drifted -- only this one ran
# check-skills, and only the release one built without clippy -- so a change
# could be green here and untested on the path that actually ships, or the
# reverse. One implementation, called by both, cannot drift.
#
# `bundle: true` means the .deb and AppImage are built and the binary is
# smoke-tested under Xvfb, not just compiled: a change that links but will not
# open a window is a red build here.
name: Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/desktop-build.yml
    with:
      bundle: true
