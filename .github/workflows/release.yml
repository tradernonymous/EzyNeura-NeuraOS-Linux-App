name: Release

# A version tag (v2.11.0) builds the .deb and the AppImage on the same
# Ubuntu 22.04 base as the Linux workflow, smoke-tests the binary, stages
# the files under stable names with a manifest the app's update check reads
# (desktop-version.json, signed when the repository has a key), publishes a
# GitHub Release, and rebuilds the apt repository on GitHub Pages.
#
# The build itself is NOT written out here: it calls desktop-build.yml, the
# same reusable workflow the Linux gate calls. This file used to carry its own
# copy of every build step, and the two copies had already drifted -- only the
# gate ran check-skills, and only this one could pass with clippy red. Now a
# release can only be cut from a build that the gate also ran.
#
# What is left here is the part that is genuinely release-only: checking the
# tag against the built version, staging the bundles under their stable names,
# signing the manifest, publishing, and the apt repository.
#
# A manual run does everything except publish unless "publish" is ticked:
# that is the dry run that proves the pipeline before a tag is pushed.
#
# Secrets and variables (packaging/release/README.md explains each):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD  (secrets)
#       sign desktop-version.json with minisign, as `tauri signer` does
#   NEURAOS_UPDATER_PUBKEY                                        (variable)
#       the matching public key, compiled into the app (net.rs)
#   APT_GPG_PRIVATE_KEY                                           (secret)
#       the armored GPG key that signs the apt repository
# Without the signing pair the manifest is unsigned and the app checks
# sha256 only; without the GPG key the apt job is skipped, not failed.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the Release and the apt repository (unticked: build, stage and sign only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/desktop-build.yml
    with:
      bundle: true

  stage:
    needs: build
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/desktop/package-lock.json

      # The bundles the reusable build produced. Upload-artifact keeps the
      # paths below `bundle/`, so this lands as <dir>/deb/*.deb and
      # <dir>/appimage/*.AppImage -- the layout stage.sh expects.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: neuraos-linux-${{ github.sha }}
          path: out/bundle

      # The tag is the only thing this job can get wrong that the build
      # cannot: a v2.11.0 tag on a tree that says 2.11.0 is right, and one
      # that says 2.10.0 would publish a release the updater would never
      # offer. Checked here, against the version the build actually reported,
      # rather than being re-derived from a file.
      - name: A tag must match the version that was built
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*)
              tag="${GITHUB_REF#refs/tags/v}"
              if [ "$tag" != "$VERSION" ]; then
                echo "tag v$tag does not match the app version $VERSION (package.json, tauri.conf.json, Cargo.toml)" >&2
                exit 1
              fi ;;
          esac

      - name: Stage the release files (stable names, digests, manifest)
        run: |
          bash packaging/release/stage.sh \
            out/bundle out/release "${{ needs.build.outputs.version }}" "$GITHUB_SHA"

      - name: Sign the manifest (skipped when the repository has no signing key)
        working-directory: app/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "no TAURI_SIGNING_PRIVATE_KEY secret: the manifest is published unsigned (sha256 checks only)"
            exit 0
          fi
          # Only the signing CLI is needed here, and no postinstall: the app
          # itself was already built and tested by the build job.
          npm ci --ignore-scripts
          npx tauri signer sign ../../out/release/desktop-version.json
          test -s ../../out/release/desktop-version.json.sig

      - name: Upload the staged release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neuraos-release-${{ needs.build.outputs.version }}
          path: out/release/*
          if-no-files-found: error

  release:
    needs: stage
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # D4: the notes are drafted from the merged PRs, so the release job
      # needs the history -- tags included, to find the previous one.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: neuraos-release-${{ needs.stage.outputs.version }}
          path: release

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.stage.outputs.version }}
        run: |
          tag="v$VERSION"
          # D4: what landed since the previous tag, from the merged PRs
          # themselves. The first release has nothing to compare against and
          # says so; a failed search omits the section rather than failing
          # the publish.
          merged=""
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_SHA^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            since=$(git log -1 --format=%cs "$prev")
            merged=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main \
              --search "is:merged merged:>=$since" --limit 50 \
              --json number,title --jq '.[] | "- #\(.number) \(.title)"' 2>/dev/null || true)
          fi
          cat > notes.md <<NOTES
          ## Merged in this release

          ${merged:-_No previous v tag to compare against._}

          ## Install on Linux Mint

          \`\`\`bash
          sudo apt install ./neura-os-desktop_${VERSION}_amd64.deb
          \`\`\`

          Or run the portable build: \`chmod +x NeuraOS-${VERSION}-x86_64.AppImage && ./NeuraOS-${VERSION}-x86_64.AppImage\`.
          The installed app updates itself from this page; \`SHA256SUMS\` lists the digests and \`desktop-version.json\` is the manifest the update check reads.
          NOTES
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "NeuraOS $VERSION" \
              --notes-file notes.md \
              --generate-notes
          fi

  apt:
    needs: [stage, release]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: neuraos-release-${{ needs.stage.outputs.version }}
          path: release

      - name: Is there a repository signing key?
        id: key
        env:
          KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "no APT_GPG_PRIVATE_KEY secret: the apt repository is not rebuilt"; fi

      - name: Build the signed apt repository
        if: steps.key.outputs.present == 'true'
        env:
          KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          sudo apt-get install -y dpkg-dev apt-utils gnupg
          printf '%s\n' "$KEY" | gpg --batch --import
          keyid=$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^sec/ { print $5; exit }')
          test -n "$keyid"
          bash packaging/apt/build-repo.sh out/apt "$keyid" release/*.deb
          cp packaging/apt/index.html out/apt/index.html
          touch out/apt/.nojekyll

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: steps.key.outputs.present == 'true'

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: steps.key.outputs.present == 'true'
        with:
          path: out/apt

      - id: deploy
        if: steps.key.outputs.present == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
