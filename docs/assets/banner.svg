<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="NeuraOS for Linux Mint">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0a16"/>
      <stop offset="1" stop-color="#050609"/>
    </linearGradient>
    <linearGradient id="neura" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8B6CFF"/>
      <stop offset="0.5" stop-color="#8B6CFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#87CF3E"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B6CFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8B6CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="24" fill="url(#grid)"/>
  <ellipse cx="220" cy="170" rx="360" ry="220" fill="url(#glow)">
    <animate attributeName="rx" values="340;380;340" dur="9s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="980" cy="120" rx="300" ry="200" fill="url(#glow2)">
    <animate attributeName="cx" values="980;940;980" dur="11s" repeatCount="indefinite"/>
  </ellipse>

  <!-- the emblem: four nodes drawing an N, violet to cyan -->
  <g transform="translate(96 66) scale(3.3)">
    <path d="M12 52V12L52 52V12" fill="none" stroke="url(#neura)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#0b0a16" stroke="url(#neura)" stroke-width="4">
      <circle cx="12" cy="12" r="6"/>
      <circle cx="12" cy="52" r="6"/>
      <circle cx="52" cy="12" r="6"/>
      <circle cx="52" cy="52" r="6"/>
    </g>
    <circle cx="52" cy="12" r="2.6" fill="#22D3EE">
      <animate attributeName="r" values="2.6;3.6;2.6" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g font-family="Inter, 'Segoe UI', Ubuntu, Cantarell, sans-serif" fill="#e8ecf5">
    <text x="330" y="140" font-size="72" font-weight="700" letter-spacing="-2">Neura<tspan fill="url(#neura)">OS</tspan></text>
    <text x="334" y="186" font-size="26" font-weight="500" fill="#a9b1c6">for <tspan fill="url(#mint)" font-weight="700">Linux Mint</tspan> · chat, code, create, agents — on your own machine</text>

    <g font-size="15" fill="#c9d0e0">
      <g transform="translate(334 228)">
        <rect width="196" height="36" rx="18" fill="#141428" stroke="#2a2a4a"/>
        <circle cx="20" cy="18" r="5" fill="#22D3EE"/>
        <text x="34" y="23">Local models on your GPU</text>
      </g>
      <g transform="translate(542 228)">
        <rect width="216" height="36" rx="18" fill="#141428" stroke="#2a2a4a"/>
        <circle cx="20" cy="18" r="5" fill="#8B6CFF"/>
        <text x="34" y="23">Coding agents, approval-gated</text>
      </g>
      <g transform="translate(770 228)">
        <rect width="150" height="36" rx="18" fill="#141428" stroke="#2a2a4a"/>
        <circle cx="20" cy="18" r="5" fill="#87CF3E"/>
        <text x="34" y="23">.deb · AppImage</text>
      </g>
      <g transform="translate(932 228)">
        <rect width="170" height="36" rx="18" fill="#141428" stroke="#2a2a4a"/>
        <circle cx="20" cy="18" r="5" fill="#FFB02E"/>
        <text x="34" y="23">Nothing leaves the PC</text>
      </g>
    </g>
  </g>

  <!-- an activity line, the orb's pulse -->
  <path d="M40 300 H1160" stroke="#ffffff" stroke-opacity="0.06"/>
  <path d="M40 300 L300 300 L320 280 L340 320 L360 300 L1160 300" fill="none" stroke="url(#neura)" stroke-width="2" filter="url(#soft)">
    <animateTransform attributeName="transform" type="translate" values="0 0;760 0;0 0" dur="14s" repeatCount="indefinite"/>
  </path>
</svg>
